<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>非遗纹样数字资源库</title>
  <meta name="description" content="可复用的通用非遗纹样数字资源库模板" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: { colors: { ink:'#1d2a25', moss:'#607768', sand:'#f4f0e7', gold:'#b58b52' }, fontFamily: { display:['Noto Serif SC','serif'], sans:['Inter','system-ui','sans-serif'] } } } };
  </script>
  <style>
    html { scroll-behavior:smooth } body { background:#f4f0e7; color:#1d2a25 }
    .grain { background-image:radial-gradient(rgba(29,42,37,.07) 1px,transparent 1px); background-size:8px 8px }
    .hero-art { background:linear-gradient(135deg,#20362e,#6d8068); position:relative; overflow:hidden }
    .hero-art:after { content:'纹'; position:absolute; right:4%; bottom:-20%; font:700 28rem/1 'Noto Serif SC',serif; color:rgba(255,255,255,.08) }

</head>
<body class="font-sans grain">
  <div id="app"></div>
  <script>
    /* ================= 项目配置：切换项目时只需修改这里 ================= */
    const PROJECT = {
      name: '织纹 · 典藏', shortName:'织纹', eyebrow:'传统工艺 · 数字化保存',
      heroTitle:'让纹样\n被看见', heroIntro:'记录、整理与再设计，让散落在器物与织物上的文化记忆，成为可检索、可学习、可应用的数字资产。',
      aboutTitle:'一座开放的纹样档案馆', aboutText:'本资源库面向研究者、设计师与公众，提供纹样图像、文化释义、来源与修复过程的结构化记录。你可以替换数据、图片与文案，快速复用于不同非遗项目。',
      footer:'保留来处，连接未来。', curator:'数字典藏工作组'
    };
    /* ================= 纹样数据：增加/替换对象即可扩展到 50-100 条 ================= */
    const SAMPLE_RECORDS = [
      {id:1,title:'连枝花叶',topic:'花卉',source:'织物残片',status:'已修复',era:'近现代',meaning:'寓意生生不息、家族绵延。',scene:'服饰、家居织物',image:'https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=900&q=85',original:'https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=900&q=60'},
      {id:2,title:'回旋云纹',topic:'云水',source:'建筑构件',status:'待修复',era:'清代',meaning:'象征祥瑞与风调雨顺。',scene:'建筑、包装、首饰',image:'https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=900&q=85',original:'https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=900&q=60'},
      {id:3,title:'双鱼相戏',topic:'瑞兽',source:'民间刺绣',status:'已修复',era:'民国',meaning:'表达和合、富足与团圆。',scene:'节庆、礼品、文创',image:'https://images.unsplash.com/photo-1582561833407-b95380302a90?auto=format&fit=crop&w=900&q=85',original:'https://images.unsplash.com/photo-1582561833407-b95380302a90?auto=format&fit=crop&w=900&q=60'},
      {id:4,title:'连环菱格',topic:'几何',source:'陶瓷纹饰',status:'已修复',era:'明代',meaning:'以秩序化结构表达坚韧与守护。',scene:'织带、壁纸、界面',image:'https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=900&q=85',original:'https://images.unsplash.com/photo-1531058020387-3be344556be6?auto=format&fit=crop&w=900&q=60'},
      {id:5,title:'折枝牡丹',topic:'花卉',source:'绣片档案',status:'修复中',era:'近现代',meaning:'盛放与圆满的祝愿。',scene:'服装、包装、家居',image:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=900&q=85',original:'https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=900&q=60'},
      {id:6,title:'雷纹方胜',topic:'几何',source:'金属器物',status:'待修复',era:'汉代',meaning:'连续不断的生命力与吉祥。',scene:'首饰、标识、家具',image:'https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=900&q=85',original:'https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=900&q=60'}
    ];
    // 本地素材清单：图片已随模板放在 assets/patterns。替换图片时，更新此数组或直接维护 PATTERNS。
    const ASSET_IMAGES = [
      'assets/patterns/077c8530887de3b89f79243a6441a700.jpg','assets/patterns/09f20f81567eca20bcb6b18685787cfa.png','assets/patterns/1011ebf0cca07bcdbc937f4093bb3b83.png','assets/patterns/1c5f55b51c5faa7087988206c20acdcf.jpg','assets/patterns/1e55a98184bd124821f696ceb2ace5ac.jpg','assets/patterns/240be95826587214a212d96d9ddd4202.jpg','assets/patterns/2757d8cb1b2219d65147159aa564ce88.png','assets/patterns/340bc481a24698455bb45db6184a315c.png','assets/patterns/37a32d550004c38a00b2168cb337cf8b.png','assets/patterns/37a69881a089db393ebf5052fec64403.jpg','assets/patterns/38753e65f5f4919e83ec11baaf4bad41.jpg','assets/patterns/39da97322b1629155af96631f71dbee6.png','assets/patterns/3a3272c773b8d674ed8023b177691de4.png','assets/patterns/3a85ebca9707b416a389b9626342e4c7.jpg','assets/patterns/3c14beb68722ab4377feecf029d4fd94.png','assets/patterns/3f69101fc5e9f894855ba6c4c4250305.png','assets/patterns/487af497cac36bc3572a2c811dd1e5da.png','assets/patterns/4a9539ccd339ecf890af635649e905ea.png','assets/patterns/4aabe0fa1f1ae3dc8b69820004600cee.png','assets/patterns/4fb341fb5627a4b8edd2a78b2c94174d.jpg','assets/patterns/5c24ef69f235600bc584887a67f081a1.jpg','assets/patterns/5ecd9058a2577eeeba8daf0245d51ef2.png','assets/patterns/5ff5b273b7b4fca5219bc77dc99aa1aa.jpg','assets/patterns/6c8d972c2db5e3a01c1dc8f8de204985.png','assets/patterns/6e96fa6c19810156a6001c743243a976.jpg','assets/patterns/718c6c6bebba954e6f856f823767398a.jpg','assets/patterns/7df426799e7f3a9e4a7f7291c5dc8937.jpg','assets/patterns/7f3750c38cc1b80246e7754ddf527262.png','assets/patterns/7fb2f17af376f3f0677853bb6346f079.jpg','assets/patterns/84158fe17706dda0a81c2b2104fc3f1f.jpg','assets/patterns/8510c26a8a3680a533f0561aa8a837c0.jpg','assets/patterns/89f5e4fee32f4e50c85ab732662ea2ae.jpg','assets/patterns/8eda11057f9b2fc46b68cb3e0767f19d.png','assets/patterns/8f4cbb84e1df49e3adf00857bd0aa6c5.jpg','assets/patterns/8fbe2a29f35b771a4078f479e86c9b52.png','assets/patterns/8fe00dbea845a4981e9619ccad5788d8.jpg','assets/patterns/92940fd5dbc459edfb7dd1675987146a.jpg','assets/patterns/96094eb0e211cc3369517e08a7a3e3a6.png','assets/patterns/9b7d1e50cc54e17db4dd0e8ec0364e4b.png','assets/patterns/9fd0c6823ccfcbae0d230aa6ac816688.jpg','assets/patterns/a21ad2a89b988c876120b136aa98b7df.jpg','assets/patterns/a49460f413d31f321007cc1149e0babf.jpg','assets/patterns/a8ed47bb42a75770140da2212610df6b.jpg','assets/patterns/ace2f8c12e38e56faa5cc2218a18f2cd.png','assets/patterns/b316e7af749546bcdfb55d31cd8ddea0.png','assets/patterns/b4cdf47c4d3be9e0617936229b4f2950.jpg','assets/patterns/b5f56c827a0817d3cde9b439918ecef3.png','assets/patterns/b945c60ca80c3b33044fc34ff52294a2.jpg','assets/patterns/b9eb8df5c656de594daeea1c6cb5c246.jpg','assets/patterns/bd264ac4ff6293a8bd4aed6172ddf364.jpg','assets/patterns/bf1fef0e08b28f4a48e9187e3c46dfcc.png','assets/patterns/ce00f038c6e2a6845b9b03cda777759b.jpg','assets/patterns/cfa78cf1e204cdd68bbb045ece82f6d9.png','assets/patterns/cfea15e9388aafc21ee834d6bbbfdd85.jpg','assets/patterns/d7d72c5803b8dbf426d78639fe639cae.jpg','assets/patterns/dad858219db529e1f3f997347ccb1d3d.png','assets/patterns/df4f14bf5285027fab91e10c849a70fe.png','assets/patterns/e5d1c67f7b6ae4bfb9c1066f0ddce757.png','assets/patterns/ea6ac6225653b446353563c9e8ddfb84.png','assets/patterns/eb7021b739449f9d384a66dcf25ed144.png','assets/patterns/ee2b3c514cebba0b348626928e7a9cd5.png'
    ];
    // 删除三个重复条目：羊角卷纹、火镰燧石纹、鹰爪抓日纹各保留一项。
    ['assets/patterns/a49460f413d31f321007cc1149e0babf.jpg','assets/patterns/a8ed47bb42a75770140da2212610df6b.jpg','assets/patterns/cfea15e9388aafc21ee834d6bbbfdd85.jpg'].forEach(path=>{const i=ASSET_IMAGES.indexOf(path); if(i>=0) ASSET_IMAGES.splice(i,1);});
    // 自动为每张素材建档；将此映射改成手工对象数组，即可录入每一件纹样的真实名称和档案信息。
    const LEGACY_PATTERNS = ASSET_IMAGES.map((image, index) => {
      const sample = SAMPLE_RECORDS[index % SAMPLE_RECORDS.length];
      return {...sample, id:index + 1, title:`纹样档案 ${String(index + 1).padStart(2, '0')}`, image, original:image};
    });
    const esc = s => String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const imgSvg = (label,color='#607768') => `data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><rect width="800" height="500" fill="#f0eadc"/><path d="M40 250 Q180 60 320 250 T600 250 T760 250 M120 390 Q240 170 360 390 T600 390" fill="none" stroke="${color}" stroke-width="20"/><circle cx="400" cy="250" r="92" fill="none" stroke="#b58b52" stroke-width="9"/><text x="400" y="275" text-anchor="middle" font-size="52" font-family="serif" fill="#1d2a25">${label}</text></svg>`)}`;
    LEGACY_PATTERNS.forEach((p,i)=>{ if(!p.image) p.image=imgSvg(p.title); if(!p.original) p.original=p.image; });
  </script>
  <script src="assets/pattern-data.js"></script>
  <script src="assets/traditional-data.js"></script>
  <script>
    const app=document.querySelector('#app');
    app.innerHTML=`<header class="sticky top-0 z-30 border-b border-ink/10 bg-sand/90 backdrop-blur"><div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4"><a href="#home" class="font-display text-2xl tracking-widest">${PROJECT.shortName}<span class="text-gold">·</span>藏</a><nav class="hidden gap-8 text-sm md:flex"><a href="#library" class="hover:text-gold">纹样库</a><a href="#traditional" class="hover:text-gold">传统纹样</a><a href="#repair" class="hover:text-gold">修复档案</a><a href="#about" class="hover:text-gold">项目概况</a></nav><a href="#library" class="rounded-full border border-ink px-4 py-2 text-xs">探索档案 ↗</a></div></header>
    <main><section id="home" class="hero-art text-white"><div class="mx-auto grid min-h-[540px] max-w-7xl items-center px-6 py-20 md:grid-cols-2"><div class="relative z-10"><p class="mb-6 text-sm tracking-[.35em] text-white/70">${PROJECT.eyebrow}</p><h1 class="whitespace-pre-line font-display text-6xl leading-[1.05] md:text-8xl">${PROJECT.heroTitle}</h1><p class="mt-8 max-w-lg text-lg leading-8 text-white/80">${PROJECT.heroIntro}</p><a href="#library" class="mt-10 inline-flex rounded-full bg-gold px-6 py-3 text-sm text-white">浏览全部纹样 <span class="ml-3">↓</span></a></div><div class="relative hidden h-80 md:block"><div class="absolute inset-8 rounded-full border border-white/20"></div><div class="absolute inset-16 rounded-full border border-white/30"></div><div class="absolute inset-24 rounded-full border-2 border-gold/70"></div><div class="absolute inset-0 flex items-center justify-center text-[12rem] font-display text-white/10">纹</div></div></div></section>
    <section id="library" class="mx-auto max-w-7xl px-6 py-20"><div class="mb-10 flex flex-col justify-between gap-6 md:flex-row md:items-end"><div><p class="text-xs tracking-[.3em] text-gold">01 / COLLECTION</p><h2 class="mt-3 font-display text-4xl">全部纹样库 <span id="count" class="ml-2 text-base text-moss"></span></h2></div><div class="flex flex-wrap gap-3"><input id="search" class="w-60 rounded-full border border-ink/20 bg-transparent px-5 py-3 text-sm outline-none focus:border-gold" placeholder="搜索名称、来源、寓意…"/><select id="topic" class="rounded-full border border-ink/20 bg-transparent px-4 py-3 text-sm"><option value="">全部题材</option></select><select id="status" class="rounded-full border border-ink/20 bg-transparent px-4 py-3 text-sm"><option value="">全部状态</option></select></div></div><div id="grid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3"></div></section>
    <section id="traditional" class="bg-white/60 py-20"><div class="mx-auto max-w-7xl px-6"><p class="text-xs tracking-[.3em] text-gold">02 / TRADITIONAL PATTERNS</p><h2 class="mt-3 font-display text-4xl">中华传统纹样资料</h2><p class="mt-4 max-w-2xl leading-8 text-ink/65">从图形、器物到民俗，读懂经典纹样如何进入日常生活。内容依据项目提供的图文资料整理。</p><div id="traditionalGrid" class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-4"></div></div></section><section id="repair" class="bg-ink py-20 text-white"><div class="mx-auto max-w-7xl px-6"><p class="text-xs tracking-[.3em] text-gold">02 / REPAIR ARCHIVE</p><div class="mt-3 grid gap-10 md:grid-cols-[.8fr_1.2fr] md:items-end"><div><h2 class="font-display text-4xl">纹样修复档案</h2><p class="mt-5 leading-8 text-white/65">通过数字清理、缺损补绘与线稿重建，保留纹样的结构信息。拖动滑块查看修复前后对照。</p></div><div id="repairBox" class="relative overflow-hidden rounded-2xl border border-white/15"><img id="afterImg" class="block h-72 w-full object-cover" src="${PATTERNS[0].image}"/><div id="beforeClip" class="absolute inset-y-0 left-0 w-1/2 overflow-hidden"><img class="h-72 w-[calc(200%)] max-w-none object-cover" src="${PATTERNS[0].original}"/></div><input id="slider" type="range" min="0" max="100" value="50" class="absolute inset-x-4 bottom-4 z-10 w-[calc(100%-2rem)]"/><div class="absolute left-4 top-4 rounded-full bg-black/40 px-3 py-1 text-xs">原始素材 / 修复后</div></div></div></div></section>
    <section id="about" class="mx-auto max-w-7xl px-6 py-20"><p class="text-xs tracking-[.3em] text-gold">03 / ABOUT PROJECT</p><div class="mt-3 grid gap-10 md:grid-cols-2"><h2 class="font-display text-4xl">${PROJECT.aboutTitle}</h2><div><p class="leading-8 text-ink/70">${PROJECT.aboutText}</p><div class="mt-8 grid grid-cols-3 gap-4 border-t border-ink/15 pt-5"><div><b class="text-3xl" id="statTotal">0</b><p class="mt-1 text-xs text-ink/55">收录纹样</p></div><div><b class="text-3xl" id="statTopics">0</b><p class="mt-1 text-xs text-ink/55">题材分类</p></div><div><b class="text-3xl">100%</b><p class="mt-1 text-xs text-ink/55">开放可复用</p></div></div></div></div></section></main><footer class="border-t border-ink/10 px-6 py-8"><div class="mx-auto flex max-w-7xl flex-col justify-between gap-3 text-sm text-ink/60 md:flex-row"><span>© 2026 ${PROJECT.name} · ${PROJECT.curator}</span><span>${PROJECT.footer}</span></div></footer>`;
    // 修复档案使用项目提供的陶器“原始素材 / 修复线稿”对照图。
    document.querySelector('#afterImg').src='assets/repair-vessel.jpg';
    document.querySelector('#beforeClip img').src='assets/repair-vessel.jpg';
    const grid=document.querySelector('#grid'), search=document.querySelector('#search'), topic=document.querySelector('#topic'), status=document.querySelector('#status');
    [...new Set(PATTERNS.map(p=>p.topic))].forEach(x=>topic.insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`)); [...new Set(PATTERNS.map(p=>p.status))].forEach(x=>status.insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));
    function render(){ const q=search.value.toLowerCase(); const list=PATTERNS.filter(p=>(!q||Object.values(p).join(' ').toLowerCase().includes(q))&&(!topic.value||p.topic===topic.value)&&(!status.value||p.status===status.value)); document.querySelector('#count').textContent=`· ${list.length} 件`; grid.innerHTML=list.map(p=>`<button data-id="${p.id}" class="group text-left"><div class="card-img relative aspect-[4/3] overflow-hidden rounded-2xl"><img src="${p.image}" alt="${esc(p.title)}" class="h-full w-full object-cover mix-blend-multiply transition duration-500 group-hover:scale-105"/><span class="absolute left-4 top-4 rounded-full bg-sand/85 px-3 py-1 text-xs">${esc(p.status)}</span></div><div class="flex justify-between pt-4"><div><h3 class="font-display text-xl">${esc(p.title)}</h3><p class="mt-1 text-xs text-ink/55">${esc(p.topic)} · ${esc(p.source)}</p></div><span class="text-xl text-gold">↗</span></div></button>`).join('')||'<p class="col-span-full py-16 text-center text-ink/50">没有找到匹配的纹样。</p>'; grid.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openDetail(+b.dataset.id)); }
    [search,topic,status].forEach(x=>x.addEventListener('input',render)); render(); document.querySelector('#statTotal').textContent=PATTERNS.length; document.querySelector('#statTopics').textContent=new Set(PATTERNS.map(p=>p.topic)).size;
    const modal=document.createElement('div'); modal.className='modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-5'; document.body.append(modal);
    function openDetail(id){const p=PATTERNS.find(x=>x.id===id); modal.innerHTML=`<div class="relative max-h-[90vh] w-full max-w-4xl overflow-auto rounded-3xl bg-sand p-6 md:p-8"><button id="close" class="absolute right-5 top-4 text-3xl">×</button><div class="grid gap-8 md:grid-cols-2"><img src="${p.image}" alt="${esc(p.title)}" class="aspect-[4/3] w-full rounded-2xl object-cover"/><div><p class="text-xs tracking-[.25em] text-gold">PATTERN ${String(p.id).padStart(2,'0')}</p><h2 class="mt-3 font-display text-4xl">${esc(p.title)}</h2><p class="mt-3 text-sm text-ink/55">${esc(p.topic)} · ${esc(p.source)} · ${esc(p.era)}</p><dl class="mt-8 grid grid-cols-2 gap-4 text-sm"><div><dt class="text-ink/45">修复状态</dt><dd class="mt-1">${esc(p.status)}</dd></div><div><dt class="text-ink/45">应用场景</dt><dd class="mt-1">${esc(p.scene)}</dd></div></dl><div class="mt-8 border-t border-ink/15 pt-5"><p class="text-xs text-ink/45">文化释义</p><p class="mt-2 leading-7">${esc(p.meaning)}</p></div><button id="download" class="mt-8 rounded-full bg-ink px-5 py-3 text-sm text-white">模拟下载资料包 ↓</button></div></div></div>`; modal.classList.remove('hidden'); modal.classList.add('flex'); modal.querySelector('#close').onclick=closeModal; modal.onclick=e=>{if(e.target===modal)closeModal()}; modal.querySelector('#download').onclick=()=>alert('演示模式：资料包下载功能未连接真实文件。'); }
    function closeModal(){modal.classList.add('hidden'); modal.classList.remove('flex')}; document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()}); document.querySelector('#slider').oninput=e=>document.querySelector('#beforeClip').style.width=e.target.value+'%';
    document.querySelector('#library h2').firstChild.textContent='彝族元素纹样库 ';
    document.addEventListener('click',e=>{const img=e.target.closest('.modal-backdrop img');if(!img)return;e.stopPropagation();const zoom=document.createElement('div');zoom.className='modal-backdrop fixed inset-0 z-[60] flex items-center justify-center p-5';zoom.innerHTML=`<img src="${img.src}" class="max-h-[90vh] max-w-[95vw] rounded-2xl object-contain shadow-2xl"/><button class="absolute right-6 top-4 text-4xl text-white">×</button>`;document.body.append(zoom);zoom.onclick=()=>zoom.remove()});
    const traditionalGrid=document.querySelector('#traditionalGrid');
    traditionalGrid.innerHTML=TRADITIONAL_PATTERNS.map(p=>`<button class="group text-left" data-traditional="${p.id}"><div class="card-img aspect-[4/3] overflow-hidden rounded-2xl"><img src="${p.cover}" alt="${esc(p.name)}" class="h-full w-full object-cover mix-blend-multiply transition duration-500 group-hover:scale-105"/></div><h3 class="mt-4 font-display text-xl">${esc(p.name)}</h3><p class="mt-1 text-xs text-gold">${esc(p.category)}</p><p class="mt-2 text-sm leading-6 text-ink/60">${esc(p.summary)}</p></button>`).join('');
    traditionalGrid.querySelectorAll('[data-traditional]').forEach(b=>b.onclick=()=>{const p=TRADITIONAL_PATTERNS.find(x=>x.id===b.dataset.traditional); modal.innerHTML=`<div class="relative max-h-[90vh] w-full max-w-5xl overflow-auto rounded-3xl bg-sand p-6 md:p-8"><button id="close" class="absolute right-5 top-4 text-3xl">×</button><h2 class="font-display text-4xl">${esc(p.name)}</h2><p class="mt-2 text-sm text-gold">${esc(p.category)} · ${esc(p.era)}</p><div class="mt-6 grid gap-6 md:grid-cols-2"><div class="grid grid-cols-2 gap-3">${p.images.map(i=>`<img src="${i}" class="h-36 w-full rounded-xl object-cover" loading="lazy"/>`).join('')}</div><div class="space-y-4 text-sm leading-7"><p><b>起源与演变：</b>${esc(p.origin)}</p><p><b>诞生背景：</b>${esc(p.background)}</p><p><b>文化寓意：</b>${esc(p.meaning)}</p><p><b>古代应用：</b>${esc(p.applications.join('；'))}</p><p><b>民俗内涵：</b>${esc(p.folk)}</p><p><b>现代应用：</b>${esc(p.modern)}</p></div></div></div>`; modal.classList.remove('hidden'); modal.classList.add('flex'); modal.querySelector('#close').onclick=closeModal; modal.onclick=e=>{if(e.target===modal)closeModal()};});
    document.addEventListener('click',e=>{const img=e.target.closest('#traditionalGrid img');if(!img)return;e.stopPropagation();const zoom=document.createElement('div');zoom.className='modal-backdrop fixed inset-0 z-[60] flex items-center justify-center p-5';zoom.innerHTML=`<img src="${img.src}" class="max-h-[90vh] max-w-[95vw] rounded-2xl object-contain shadow-2xl"/><button class="absolute right-6 top-4 text-4xl text-white">×</button>`;document.body.append(zoom);zoom.onclick=()=>zoom.remove()});
  </script>
</body></html>
